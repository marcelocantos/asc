[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asc"
dynamic = ["version"]
description = "App Store Connect API CLI — sales, reviews, and studio telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Marcelo Cantos" }]
keywords = ["appstore", "app-store-connect", "sales", "telemetry", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "PyJWT[crypto]>=2.8",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/marcelocantos/asc"
Repository = "https://github.com/marcelocantos/asc"
Issues = "https://github.com/marcelocantos/asc/issues"

[project.scripts]
asc = "asc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "asc.__version__" }
