schema_version: 5
targets:
  T1:
    name: asc CLI fetches MultiMaze sales units from the App Store Connect API
    status: identified
    value: 5.0
    cost: 2.0
    acceptance:
    - "`asc sales --app MultiMaze -d 30` returns first-time download units against a live Sales-capable key"
    - "`asc apps` lists MultiMaze (com.squz.multimaze / sku 201002090)"
    - "`asc reviews --app MultiMaze` returns recent customer reviews"
    - Credentials live only under ~/.appstoreconnect/ (config.json + private_keys); nothing secret is committed
    - Unit tests cover TSV parse + download/update kind filtering
    - "`asc --help` / `--version` / `--help-agent` work"
    context: |-
      Studio telemetry should be API-first, not Playwright scraping. Playwright
      is only for minting keys / one-shot UI access. Squz vendor number is
      85112238; Sales-capable key is the team "ops" key (Access to Reports +
      Sales). Default sales measure matches ASC Trends "Units" (Product Type
      1/1F first-time downloads).
    tags:
    - telemetry
    - app-store-connect
    origin: session
    discovered: 2026-07-21
